services:
  postgres:
    image: postgres:17-alpine
    container_name: four-cards-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fourcards}
      POSTGRES_USER: ${POSTGRES_USER:-fourcards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fourcards}
    ports:
      - "5432:5432"
    volumes:
      - four_cards_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fourcards} -d ${POSTGRES_DB:-fourcards}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  four_cards_pg:
